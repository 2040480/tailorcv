services:
  tailorcv-prod:
    build:
      context: .
      target: runner
    container_name: tailorcv-prod
    restart: unless-stopped
    env_file: .env.prod
    ports:
      - "3100:3000"
    networks:
      - infrastructure_proxy
      - tailorcv_db_network

  tailorcv-prod-migrate:
    build:
      context: .
      target: migrator
    env_file: .env.prod
    networks:
      - tailorcv_db_network
    profiles:
      - migrate

networks:
  infrastructure_proxy:
    external: true
  tailorcv_db_network:
    external: true
